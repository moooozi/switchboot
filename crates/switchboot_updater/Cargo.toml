[package]
name = "switchboot_updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Signed Windows installer updates for Switchboot"
publish = false

[dependencies]
base64 = "0.22"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
minisign = "0.9"
