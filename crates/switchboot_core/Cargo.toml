[package]
name = "switchboot_core"
version = "0.1.0"
description = "Switchboot privileged CLI, IPC, and platform services"
edition = "2024"
publish = false

[build-dependencies]
toml = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
firmware_variables = { git = "https://github.com/moooozi/firmware_variables", tag = "v0.1" }
bincode = "1"

[target.'cfg(windows)'.dependencies]
pipeguard = { git = "https://github.com/moooozi/pipeguard", tag = "v0.1" }
tokio = { version = "1", features = ["io-std"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Services", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-service = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
