[package]
name = "switchboot"
version = "0.3.0"
description = "Manage EFI boot entries on Windows and Linux"
authors = ["M Zidane"]
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
members = ["crates/switchboot_core", "crates/switchboot_ui"]
resolver = "3"

[dependencies]
switchboot_core = { path = "crates/switchboot_core" }
switchboot_ui = { path = "crates/switchboot_ui" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = 2
codegen-units = 1
