name: "Authenticode Sign"
description: "Sign and verify required files with an Authenticode PFX on Windows runners."
inputs:
  files:
    description: "Semicolon-separated list of file paths to sign (relative to workspace)."
    required: true
runs:
  using: "composite"
  steps:
    - name: Sign files with signtool
      shell: pwsh
      env:
        FILES_RAW: ${{ inputs.files }}
      run: |
        $ErrorActionPreference = 'Stop'
        $files = @($env:FILES_RAW -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' })
        if ($files.Count -eq 0) { throw 'No signing inputs provided.' }
        foreach ($file in $files) {
          if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
            throw "Required signing input is missing or empty: $file"
          }
        }
        if (-not $env:CERT_PFX -or -not $env:CERT_PASSWORD) {
          throw 'CERT_PFX and CERT_PASSWORD must be provided.'
        }

        $pfxPath = Join-Path $env:RUNNER_TEMP ('codesign-' + [guid]::NewGuid().ToString() + '.pfx')
        try {
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_PFX))
          foreach ($file in $files) {
            Write-Host "Signing $file"
            & signtool sign /fd SHA256 /a /f $pfxPath /p $env:CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "signtool signing failed for $file" }
            & signtool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $file" }
          }
        } finally {
          if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
        }
