name: "GPG Sign"
description: "Create and verify detached GPG signatures for required release files."
inputs:
  files:
    description: "Semicolon-separated list of file paths to sign (relative to workspace)."
    required: true
runs:
  using: "composite"
  steps:
    - name: Import key and sign files (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      env:
        FILES_RAW: ${{ inputs.files }}
      run: |
        set -euo pipefail
        : "${FILES_RAW:?No files provided}"
        : "${GPG_PRIVATE_KEY:?GPG_PRIVATE_KEY must be provided}"
        IFS=';' read -r -a filesArr <<< "$FILES_RAW"
        for f in "${filesArr[@]}"; do
          if [ ! -s "$f" ]; then
            echo "Required signing input is missing or empty: $f" >&2
            exit 1
          fi
        done

        GNUPGHOME=$(mktemp -d)
        export GNUPGHOME
        cleanup() {
          gpgconf --kill gpg-agent >/dev/null 2>&1 || true
          rm -rf "$GNUPGHOME"
        }
        trap cleanup EXIT
        printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

        for f in "${filesArr[@]}"; do
          echo "Signing $f"
          printf '%s\n' "${GPG_PASSPHRASE:-}" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign -o "$f.asc" "$f"
          gpg --batch --verify "$f.asc" "$f"
        done
