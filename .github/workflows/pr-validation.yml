name: PR validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download production NSIS DLL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $revision = git -C packaging/nsis/toolkit rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download "dll-$revision" --repo moooozi/nsis-kit --pattern native_nsis_ui.dll --pattern plugin.json --dir artifacts/nsis-dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/nsis/toolkit/dll_artifact.py artifacts/nsis-dll --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare validation logs
        run: mkdir -p ci-logs
      - name: Install Linux native build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev rpm xvfb
      - name: Install Windows packaging compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up Rust
        id: rust
        run: |
          rustup update stable
          rustup component add rustfmt clippy
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: Install icon tooling wheels
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Generate icons from SVG sources
        run: |
          python scripts/generate_icons.py
      - name: Test Python tooling and package fixtures
        env:
          SWITCHBOOT_REQUIRE_PACKAGING_TESTS: '1'
        run: python -B -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee ci-logs/python-tests.log
      - name: Check and test the native workspace
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log
          cargo test --locked --workspace --all-targets 2>&1 | tee ci-logs/rust-tests.log
          cargo test --locked --manifest-path packaging/updater-sign/Cargo.toml
          cargo build --locked --release --bin switchboot 2>&1 | tee ci-logs/build.log
      - name: Linux native demo startup
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          xvfb-run -a timeout --signal=TERM 15s target/release/switchboot --demo > ci-logs/demo-startup.log 2>&1
          result=$?
          cat ci-logs/demo-startup.log
          test "$result" -eq 124
      - name: Assemble unsigned Linux packages
        if: runner.os == 'Linux'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          bash packaging/linux.sh "$version"
      - name: Assemble unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/nsis/build.py --payload target/release/switchboot.exe --plugin-artifact artifacts/nsis-dll --output artifacts/Switchboot_x64-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect binaries and packages
        run: python scripts/collect-ci-artifacts.py
      - name: Upload unsigned builds
        uses: actions/upload-artifact@v7
        with:
          name: switchboot-pr-${{ runner.os }}-${{ github.sha }}
          path: artifacts/ci/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: switchboot-pr-logs-${{ runner.os }}-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
