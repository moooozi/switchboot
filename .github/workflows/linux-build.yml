name: Linux Build

permissions:
  contents: read
  id-token: write # request OIDC token for signing
  attestations: write # persist build provenance attestation

on:
  workflow_call:
    inputs:
      version:
        description: "version (e.g. 0.1.1)"
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: false

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check for GPG secret
        id: secrets_check
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "have_gpg=true" >> $GITHUB_OUTPUT
          else
            echo "have_gpg=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install icon tooling
        run: pnpm install --frozen-lockfile

      - name: Install native build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev rpm

      - name: Update Rust
        run: rustup update stable

      - name: Capture Rust toolchain version
        id: rustver
        shell: bash
        run: |
          # capture a concise rust toolchain string (e.g. 1.76.0)
          if command -v rustc >/dev/null 2>&1; then
            rv=$(rustc --version | awk '{print $2}') || rv="unknown"
          else
            rv="unknown"
          fi
          echo "rust_version=$rv" >> $GITHUB_OUTPUT

      - name: Cache Cargo registry and git
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ steps.rustver.outputs.rust_version }}

      # Optional: cache the Rust build target directory to speed up repeated CI runs.
      - name: Cache Cargo build target (optional)
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ steps.rustver.outputs.rust_version }}


      - name: Generate shortcut icons
        run: |
          pnpm icons
          node packaging/generate-app-icons.mjs

      - name: Validate Rust and tooling
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace --all-targets
          cargo test --locked --manifest-path packaging/updater-sign/Cargo.toml
          node --test scripts/release.test.mjs scripts/icons.test.mjs
          python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Build native application
        run: cargo build --locked --release --bin switchboot

      - name: Build DEB and RPM packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash packaging/linux.sh "$RELEASE_VERSION"

      - name: Collect artifacts
        id: collect
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/collect-linux-artifacts.sh "$RELEASE_VERSION"

      - name: Install RPM signing tools (rpm, gnupg, expect)
        if: steps.secrets_check.outputs.have_gpg == 'true'
        shell: bash
        run: |
          set -e
          echo "Installing packages required for signing RPMs..."
          sudo apt-get update
          sudo apt-get install -y rpm gnupg expect

      - name: Debug artifacts directory before signing
        if: steps.secrets_check.outputs.have_gpg == 'true'
        shell: bash
        run: |
          set -e
          echo "Current working directory: $(pwd)"
          echo "Listing artifacts directory:"
          ls -l "$(pwd)/artifacts" || true
          echo "Listing RPM files in artifacts:"
          ls -l "$(pwd)"/artifacts/*.rpm || true

      - name: Sign RPM packages (embed signature)
        if: steps.secrets_check.outputs.have_gpg == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          cleanup() {
            gpgconf --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf "$GNUPGHOME"
            rm -f "$HOME/.rpmmacros"
          }
          trap cleanup EXIT
          printf '%s\n' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

          # Determine GPG user name from the imported secret key
          GPG_KEY_NAME=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid:/ {print $10; exit}')
          if [ -z "$GPG_KEY_NAME" ]; then
            echo "Failed to determine GPG key name" >&2
            exit 1
          fi

          echo "Configuring rpm macros for GPG: $GPG_KEY_NAME"
          # Ensure gpg uses loopback pinentry for non-interactive passphrase
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name $GPG_KEY_NAME" >> ~/.rpmmacros
          # The macro contains only the path to the private passphrase file, not its value.
          echo "%__gpg /usr/bin/gpg" >> ~/.rpmmacros
          echo "%__gpg_sign_cmd %{__gpg} gpg --batch --yes --pinentry-mode loopback --passphrase-file \"$GNUPGHOME/passphrase\" -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" >> ~/.rpmmacros

          # Use absolute path for RPM files and sign directly (no expect)
          for rpm in artifacts/*.rpm; do
            if [ -f "$rpm" ]; then
              echo "Signing $rpm"
              rpm --addsign "$rpm"
            else
              echo "RPM not found: $rpm"
            fi
          done

          # Cleanup sensitive signing artifacts and environment
          echo "Cleaning up signing artifacts"
          # Remove temporary RPM configuration; the EXIT trap also handles failures.
          if [ -f "$HOME/.rpmmacros" ]; then
            shred -u -z "$HOME/.rpmmacros" 2>/dev/null || rm -f "$HOME/.rpmmacros" || true
          fi
          # clear passphrase from environment
          unset GPG_PASSPHRASE || true
          export GPG_PASSPHRASE=''

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts-${{ inputs.version }}
          path: artifacts/*

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.deb
            artifacts/*.rpm
