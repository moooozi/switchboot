name: Windows Build

permissions:
  contents: read
  id-token: write
  attestations: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
      - name: Install icon tooling
        run: pnpm install --frozen-lockfile
      - name: Update Rust
        run: rustup update stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Generate shortcut icons
        run: |
          pnpm icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packaging/generate-app-icons.mjs
      - name: Install Inno Setup
        run: choco upgrade innosetup --version=6.7.3 --yes --no-progress
      - name: Validate Rust and tooling
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path packaging/updater-sign/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release.test.mjs scripts/icons.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test updater signing compatibility
        run: cargo test --locked --manifest-path packaging/updater-sign/Cargo.toml
      - name: Build native application
        run: cargo build --locked --release --bin switchboot
      - name: Package installer and portable binary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVERSION=$env:RELEASE_VERSION" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath target/release/switchboot.exe -Destination artifacts/Switchboot_x64-portable.exe
          foreach ($name in @('Switchboot_x64-setup.exe', 'Switchboot_x64-portable.exe')) {
            if ((Get-Item -LiteralPath "artifacts/$name").Length -eq 0) { throw "Empty artifact: $name" }
          }
      - name: Sign installer for existing updater clients
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo run --locked --release --manifest-path packaging/updater-sign/Cargo.toml -- artifacts/Switchboot_x64-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts-${{ inputs.version }}
          path: artifacts/*
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.exe
