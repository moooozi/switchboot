name: Windows Build

permissions:
  contents: read
  id-token: write
  attestations: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Update Rust
        run: |
          rustup update stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add i686-pc-windows-msvc
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install icon tooling wheels
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Generate application and shortcut icons
        run: |
          python scripts/generate_icons.py
      - name: Install NSIS
        run: choco upgrade nsis --yes --no-progress
      - name: Validate Rust and tooling
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path packaging/updater-sign/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test updater signing compatibility
        run: cargo test --locked --manifest-path packaging/updater-sign/Cargo.toml
      - name: Build native application
        run: cargo build --locked --release --bin switchboot
      - name: Package installer and portable binary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          python packaging/nsis/build.py --output artifacts/Switchboot_x64-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/switchboot.exe -Destination artifacts/Switchboot_x64-portable.exe
          foreach ($name in @('Switchboot_x64-setup.exe', 'Switchboot_x64-portable.exe')) {
            if ((Get-Item -LiteralPath "artifacts/$name").Length -eq 0) { throw "Empty artifact: $name" }
          }
      - name: Sign installer for existing updater clients
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo run --locked --release --manifest-path packaging/updater-sign/Cargo.toml -- artifacts/Switchboot_x64-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts-${{ inputs.version }}
          path: artifacts/*
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.exe
