name: Native validation

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - name: Install Linux build and validation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev rpm xvfb
      - name: Install Windows packaging compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set up Rust
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Generate icons
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm icons
          node packaging/generate-app-icons.mjs
      - name: Check Rust and tooling
        shell: bash
        env:
          SWITCHBOOT_REQUIRE_PACKAGING_TESTS: '1'
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo test --locked --manifest-path packaging/updater-sign/Cargo.toml
          node --test scripts/release.test.mjs scripts/icons.test.mjs scripts/app-icons.test.mjs
          python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Build native binary
        run: cargo build --locked --release --bin switchboot
      - name: Linux demo startup (in-memory backend only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          xvfb-run -a timeout --signal=TERM 15s target/release/switchboot --demo > demo-startup.log 2>&1
          result=$?
          cat demo-startup.log
          # A running window must survive until timeout, rather than exit on startup.
          test "$result" -eq 124
      - name: Assemble Linux packages (without installation)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          bash packaging/linux.sh "$version"
          dpkg-deb --info "target/release/bundle/deb/switchboot_${version}_amd64.deb"
          rpm -qp --requires "target/release/bundle/rpm/switchboot-${version}-1.x86_64.rpm"
      - name: Assemble Windows installer (without execution)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$version" packaging/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned validation packages and demo log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-validation-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            artifacts/*.exe
            demo-startup.log
