name: Release Pipeline

# Triggered when a signed `vX.Y.Z` tag is pushed (created by `pnpm release`).
# The tag IS the release source of truth — there is no release branch and no
# tag is (re)created here. The pipeline only builds, signs and opens a DRAFT
# GitHub release. Publishing that draft (manually) then updates the package
# repositories via update-repository.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write # build provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches committed versions
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver (vX.Y.Z)"
            exit 1
          fi
          PKG=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          CARGO=$(grep -m1 -E '^version' src-tauri/Cargo.toml | sed -E 's/[^"]*"([^"]+)".*/\1/')
          echo "tag=$TAG  version=$VERSION  package.json=$PKG  Cargo.toml=$CARGO"
          if [ "$PKG" != "$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "::error::Version mismatch: tag=$VERSION but package.json=$PKG, Cargo.toml=$CARGO."
            echo "Run 'pnpm release <type>' to bump both files and create the tag together."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-linux:
    needs: prepare
    uses: ./.github/workflows/linux-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-windows:
    needs: prepare
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-linux
      - build-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs full history + tags

      - name: Download linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Download windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Show artifacts
        run: ls -la artifacts || true

      - name: Collect files to sign
        id: collect_files
        shell: bash
        run: |
          files=$(find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.exe" \) | tr '\n' ';' | sed 's/;$//')
          echo "files=$files" >> $GITHUB_OUTPUT
          echo "Files to sign: $files"

      - name: Move Tauri updater signatures aside
        shell: bash
        run: |
          mkdir -p artifacts/update-sig
          mv artifacts/*.sig artifacts/update-sig/ 2>/dev/null || echo "No .sig files to move"

      - name: Sign artifacts with GPG
        if: steps.collect_files.outputs.files != ''
        uses: ./.github/actions/gpg-sign
        with:
          files: ${{ steps.collect_files.outputs.files }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate changelog from commits
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Compose release body (changelog + verification)
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            cat CHANGES.md
            echo ""
            echo "---"
            echo ""
            echo "## Verification"
            echo ""
            echo "Each asset is GPG-signed (`.asc` attached to this release) and has build provenance."
            echo ""
            echo "- **GPG public key:** https://github.com/moooozi.gpg"
            echo "- **Verify build provenance:** \`gh attestation verify ${GITHUB_REPOSITORY}@${TAG}\`"
          } > release_body.md
          echo "=== release body ==="
          cat release_body.md

      - name: Create DRAFT GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Switchboot ${{ needs.prepare.outputs.tag }}
          body_path: release_body.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # Attach packages, GPG detached signatures (.asc) and Tauri updater
          # signatures (.sig). These release assets are the transport used by
          # update-repository.yml when the draft is published.
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.exe
            artifacts/*.asc
            artifacts/update-sig/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
