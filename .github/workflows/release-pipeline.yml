name: Release Pipeline

# Triggered when a `vX.Y.Z` tag is pushed (created by `python scripts/release.py`).
# Tag signing is optional; CI checks ancestry, not the signer's identity.
# The tag IS the release source of truth â€” there is no release branch and no
# tag is (re)created here. The pipeline only builds, signs and opens a DRAFT
# GitHub release. Publishing that draft (manually) then updates the package
# repositories via update-repository.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify tag matches committed versions
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver (vX.Y.Z)"
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          version = sys.argv[1]
          manifest = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]
          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          local = [p for p in lock["package"] if p["name"] == manifest["name"] and "source" not in p]
          if manifest["version"] != version or len(local) != 1 or local[0]["version"] != version:
              sys.exit("Tag, root Cargo.toml and local Cargo.lock package versions must match. Use python scripts/release.py.")
          print(f"Verified release v{version}")
          PY
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-linux:
    needs: prepare
    uses: ./.github/workflows/linux-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  build-windows:
    needs: prepare
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  create-release:
    name: Create Draft Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-linux
      - build-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs full history + tags

      - name: Download linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Download windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Show artifacts
        run: ls -la artifacts || true

      - name: Collect files to sign
        id: collect_files
        shell: bash
        run: |
          files=$(find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.exe" \) | tr '\n' ';' | sed 's/;$//')
          echo "files=$files" >> $GITHUB_OUTPUT
          echo "Files to sign: $files"

      - name: Preserve compatible updater signatures
        shell: bash
        run: |
          test -s artifacts/Switchboot_x64-setup.exe.sig
          mkdir -p artifacts/update-sig
          mv artifacts/*.sig artifacts/update-sig/

      - name: Sign artifacts with GPG
        if: steps.collect_files.outputs.files != ''
        uses: ./.github/actions/gpg-sign
        with:
          files: ${{ steps.collect_files.outputs.files }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate changelog from commits
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Compose release body (changelog + verification)
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            cat CHANGES.md
            echo ""
            echo "---"
            echo ""
            echo "## Verification"
            echo ""
            echo 'Each asset is GPG-signed (`.asc` attached to this release) and has build provenance.'
            echo ""
            echo "- **GPG public key:** https://github.com/moooozi.gpg"
            echo "- **Verify build provenance:** download an asset from this release, then run \`gh attestation verify <downloaded-asset> --repo ${GITHUB_REPOSITORY}\`."
          } > release_body.md
          echo "=== release body ==="
          cat release_body.md

      - name: Create DRAFT GitHub Release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Switchboot ${{ needs.prepare.outputs.tag }}
          body_path: release_body.md
          draft: true
          prerelease: false
          # Create and upload in one draft-only action to prevent automatic publication.
          # Native packages, GPG signatures and compatible updater signatures.
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.exe
            artifacts/*.asc
            artifacts/update-sig/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
